name: Release images

# A tag vX.Y.Z publishes ghcr.io/othorg/{amd64,aarch64}-solar-visor-hub:X.Y.Z – the version solar_visor/config.yaml
# names. Home Assistant pulls the image of that version; push the tag before (or with) the config change on main.
# Once both images are out, a GitHub release X.Y.Z carries the dashboard card (solar-visor-card.js) – HACS installs
# the card from the latest release (hacs.json).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Version of the tag = version of the app
        id: version
        run: |
          v="$(sed -n 's/^version: "\(.*\)"/\1/p' solar_visor/config.yaml)"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match config.yaml $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: scripts/build-context.sh build/context
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: build/context
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/othorg/${{ matrix.arch }}-solar-visor-hub:${{ steps.version.outputs.version }}
          labels: |
            io.hass.name=Solar Visor Hub
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=app
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/othorg/solar-visor-ha-hub-app
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: The published image starts on its architecture
        run: |
          image=ghcr.io/othorg/${{ matrix.arch }}-solar-visor-hub:${{ steps.version.outputs.version }}
          docker run -d --name sv --platform ${{ matrix.platform }} -e SUPERVISOR_TOKEN=ci -p 127.0.0.1:18080:8080 "$image"
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:18080/health/live >/dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:18080/health/live
          docker rm -f sv

  card:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the dashboard card (loader)
        working-directory: web
        run: npm ci --no-audit --no-fund && npx vite build -c vite.card.config.ts --mode loader
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v head="## $v" '$0 == head {f = 1; next} /^## / {f = 0} f' solar_visor/CHANGELOG.md > build/notes.md
          grep -q '[^[:space:]]' build/notes.md || { echo "no changelog entry for $v"; exit 1; }
      - name: GitHub release with the card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/card/solar-visor-card.js --verify-tag \
            --title "Solar Visor Hub ${GITHUB_REF_NAME#v}" --notes-file build/notes.md
